<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万紫千紅 キャラ贈り物チェッカー</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fb}body{margin:0}.wrap{max-width:860px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#243b75,#5069b2);color:white;padding:24px;border-radius:22px;box-shadow:0 10px 30px #233b7522}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}.hero p{margin:0;opacity:.9}.panel{background:white;margin-top:18px;padding:18px;border-radius:18px;box-shadow:0 8px 24px #1b2d5514}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{font-size:18px;padding:14px;border:1px solid #ccd3e0;border-radius:12px;background:white}.status{margin-top:12px;font-size:13px;color:#63708a}.name{font-size:30px;font-weight:800;margin:4px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:16px;border-radius:15px;background:#f7f8fc}.card h2{font-size:17px;margin:0 0 10px}.love{border-left:6px solid #d64c70}.like{border-left:6px solid #e5a93d}.things{border-left:6px solid #4f7db8}.card ul{margin:0;padding-left:22px;line-height:1.75}.empty{color:#8a93a5}.foot{font-size:12px;color:#748096;line-height:1.6;margin-top:18px}@media(max-width:640px){.controls,.grid{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:14px}.name{font-size:26px}}
</style></head><body><main class="wrap"><section class="hero"><h1>キャラ贈り物チェッカー</h1><p>名前を選ぶだけで「大好き・好き・好きなもの」を表示</p></section><section class="panel"><div class="controls"><input id="search" placeholder="キャラ名を検索" autocomplete="off"><select id="select"><option value="">キャラクターを選択</option></select></div><div id="status" class="status">データを読み込んでいます…</div></section><section id="result" class="panel" hidden><div id="name" class="name"></div><div class="grid"><div class="card love"><h2>❤️ 大好きな贈り物</h2><div id="love"></div></div><div class="card like"><h2>👍 好きな贈り物</h2><div id="like"></div></div><div class="card things"><h2>⭐ 好きなもの</h2><div id="things"></div></div></div></section><div class="foot">情報元のページが更新されると、定期更新処理が新しい内容を取得して data.json を更新する構成です。ページ構造変更などで取得できなくなった場合は、最終成功データを表示し続けます。</div></main><script>
let DATA=[];const sel=document.querySelector('#select'),search=document.querySelector('#search'),result=document.querySelector('#result');
function list(a){return a&&a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<span class="empty">情報なし／調査中</span>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(name){const c=DATA.find(x=>x.name===name);if(!c){result.hidden=true;return}result.hidden=false;document.querySelector('#name').textContent=c.name;document.querySelector('#love').innerHTML=list(c.love);document.querySelector('#like').innerHTML=list(c.like);document.querySelector('#things').innerHTML=list(c.things)}
function fill(q=''){const cur=sel.value;sel.innerHTML='<option value="">キャラクターを選択</option>';DATA.filter(x=>x.name.includes(q)).forEach(x=>sel.add(new Option(x.name,x.name)));if([...sel.options].some(o=>o.value===cur))sel.value=cur}
sel.onchange=()=>render(sel.value);search.oninput=()=>fill(search.value.trim());
fetch('data.json?'+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{DATA=d.characters||[];fill();document.querySelector('#status').textContent=`${DATA.length}人のデータ / 最終取得: ${d.updatedAt||'不明'} / 元ページ更新: ${d.sourceUpdatedAt||'不明'}`}).catch(()=>document.querySelector('#status').textContent='data.json を読み込めませんでした。Webサーバー上で開いてください。');
</script></body></html>
